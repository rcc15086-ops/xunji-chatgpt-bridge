services:
  - type: web
    name: xunji-chatgpt-bridge
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: MCP_ACCESS_TOKEN
        generateValue: true
      - key: XUNJI_TRAIN_API_KEY
        sync: false
      - key: XUNJI_FOOD_API_KEY
        sync: false
      - key: XUNJI_BODY_API_KEY
        sync: false
      - key: APP_TIMEZONE
        value: Asia/Hong_Kong
